<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        .seccion {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }
        .cuadro {
            width: 300px;
            height: 300px;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .cuadro img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="seccion">
        <div>
            <label for="selectColor">Seleccione:</label>
            <select id="selectColor">
                <option value="">Elija un color</option>
                <option value="yellow">Amarillo</option>
                <option value="blue">Azul</option>
                <option value="red">Rojo</option>
            </select>
        </div>

        <button onclick="mostrarColor()">Mostrar</button>

        <div id="cuadroColor" class="cuadro"></div>
    </div>


    <div class="seccion">
        <div>
            <label for="selectVehiculo">Seleccione:</label>
            <select id="selectVehiculo">
                <option value="">Elija un vehículo</option>
                <option value="carro">Carro</option>
                <option value="moto">Moto</option>
                <option value="bicicleta">Bicicleta</option>
            </select>
        </div>

        <button onclick="mostrarVehiculo()">Mostrar</button>

        <div id="cuadroVehiculo" class="cuadro"></div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
